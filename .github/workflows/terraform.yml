name: Terraform Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Please mention the environment to deploy the change
        type: choice
        options:
          - dev
          - prd
          - uat
          - ' '
        default: ' '
        required: true
      action:
        description: Please describe the terraform action to perform
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::739287607261:role/epmt-github-executions-central-role
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      # - name: tf format
      #   run: terraform fmt -check

      - name: tf init
        run: terraform init

      - name: tf plan
        if: inputs.action == 'plan'
        run: terraform plan -out=tfplan

      - name: tf plan & apply
        if: inputs.action == 'apply'
        run:  |
          terraform plan -out=tfplan
          terraform apply --auto-approve tfplan

      - name: tf destroy
        if: inputs.action == 'destroy'
        run: terraform destroy --auto-approve
        
